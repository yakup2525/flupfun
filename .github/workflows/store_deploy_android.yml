name: Android release artifact

# Publication is performed explicitly in Play Console after declaration/QA checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
      - name: Restore private signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s' "$KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release --dart-define-from-file=config/ads.production.json
      - uses: actions/upload-artifact@v4
        with:
          name: flup-fun-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
